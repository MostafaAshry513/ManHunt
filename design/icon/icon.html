<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ManHunt — icon workbench</title>
    <style>
      @font-face{font-family:"BricolageIcon";src:url("BricolageGrotesque.ttf") format("truetype");font-weight:200 800;font-stretch:75% 100%}
      @font-face{font-family:"ArchivoIcon";src:url("Archivo.ttf") format("truetype");font-weight:100 900}
    </style>
    <link rel="stylesheet" href="mockup-core.css" />
    <link rel="stylesheet" href="icon.css" />
  </head>
  <body>
    <script src="icon.js"></script>
    <script>
      /* ManHunt icon round 03.
         One master on the 1024 grid. Essential marks inside r469.
         The palette is the NIGHT SHIFT system; one lime point is the constant. */
      const R = {
        canvas: "#08090A",
        surface: "#121416",
        bone: "#F3EFE6",
        muted: "#A6A39B",
        flare: "#FF5A36",
        lime: "#B8F04A",
        cobalt: "#6D8CFF",
      };
      const RD = {
        canvas: "#08090A",
        surface: "#121416",
        bone: "#F3EFE6",
        muted: "#A6A39B",
        flare: "#FF5A36",
        lime: "#B8F04A",
        cobalt: "#6D8CFF",
      };
      const P = (extra) => ({
        light: { bg: R.canvas, mark: R.bone, accent: R.flare, point: R.lime, ...extra },
        dark: { bg: RD.canvas, mark: RD.bone, accent: RD.flare, point: RD.lime, ...extra },
        mono: { bg: "#000000", mark: "#ffffff", accent: "#ffffff", point: "#ffffff", ...extra },
      });

      const concepts = [
        {
          id: "m",
          name: "M",
          direction: "letterform",
          note: "The bet: one rounded M can carry the brand and still feel drawn, not constructed. Risk: an M is generic; the live dot in the counter has to make it ours.",
          palettes: P(),
          art: (p) => `
            <path d="M300 770 C300 520 300 360 344 340 C388 320 450 490 512 620 C574 490 636 320 680 340 C724 360 724 520 724 770" fill="none" stroke="${p.mark}" stroke-width="112" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="512" cy="468" r="40" fill="${p.point}"/>`,
        },
        {
          id: "hide",
          name: "Hide",
          direction: "symbol",
          note: "The bet: a single hooded silhouette makes hiding a body, not a wall plus a head plus an eye. Risk: read as a generic avatar; the droop of the hood and the one eye have to carry it.",
          palettes: P(),
          art: (p) => `
            <path d="M270 806 C230 700 270 570 384 530 C342 444 398 330 506 330 C618 330 672 444 628 530 C738 570 780 700 738 806 C620 846 388 846 270 806 Z" fill="${p.mark}"/>
            <circle cx="464" cy="464" r="42" fill="${p.point}"/>`,
        },
        {
          id: "leap",
          name: "Leap",
          direction: "symbol",
          note: "The bet: movement can be one continuous stroke, not a person built from parts. Risk: the arc could read as decoration; the dot has to feel like the thing being chased.",
          palettes: P(),
          art: (p) => `
            <path d="M250 724 C380 780 420 630 500 552 C580 474 636 410 740 390" fill="none" stroke="${p.accent}" stroke-width="96" stroke-linecap="round"/>
            <circle cx="740" cy="390" r="54" fill="${p.point}"/>`,
        },
        {
          id: "chase",
          name: "Chase",
          direction: "abstract",
          note: "The bet: two opposing curves and one point say pursuit without a figure or a map. Risk: a pair of arcs can look like a loading glyph if the asymmetry is not strong enough.",
          palettes: P(),
          art: (p) => `
            <path d="M270 720 C180 560 240 330 430 280" fill="none" stroke="${p.accent}" stroke-width="96" stroke-linecap="round"/>
            <path d="M754 304 C844 464 784 694 594 744" fill="none" stroke="${p.mark}" stroke-width="96" stroke-linecap="round"/>
            <circle cx="512" cy="512" r="50" fill="${p.point}"/>`,
        },
      ];

      renderIconWorkbench({
        title: "ManHunt",
        intro:
          "Icon round 04, built in the app-icon workbench. Four directions, one continuous shape each: no stacked walls, plates and badges. The field is dark camera, blue chat, green map, yellow music, white grid, red play; no real marks.",
        appName: "ManHunt",
        roles: R,
        concepts,
        typefaces: {
          glyph: "M",
          palette: { bg: R.canvas, fg: R.bone },
          fonts: [
            { family: "BricolageIcon", weight: 700 },
            { family: "ArchivoIcon", weight: 800 },
            { family: "Georgia", weight: 700 },
            { family: "Arial Black", weight: 900 },
          ],
        },
        shelf: {
          competitors: [
            { name: "Dark camera", bg: "#17181B", fg: "#F2F2F2", glyph: "circle" },
            { name: "Blue chat", bg: "#2F6FD6", fg: "#FFFFFF", glyph: "bubble" },
            { name: "Green map", bg: "#1E8E5A", fg: "#FFFFFF", glyph: "ring" },
            { name: "Yellow music", bg: "#F4C542", fg: "#1B1B1B", glyph: "wave" },
            { name: "White grid", bg: "#FFFFFF", fg: "#30343A", glyph: "grid" },
            { name: "Red play", bg: "#E33A35", fg: "#FFFFFF", glyph: "letter:P" },
          ],
        },
        pageNotes: [
          ["What changed for round 04", "Round 03 stacked a wall, a head and an eye; this round uses one continuous shape plus the lime point. Judged at 60 / 40 / 29 / 16 before the hero, then Android 108/72/66."],
          ["Constant", "One lime report point. M is the brand bet; Hide is the human bet; Leap and Chase are the movement bets."],
        ],
      });
    </script>
  </body>
</html>

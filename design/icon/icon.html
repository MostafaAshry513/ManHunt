<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ManHunt — icon workbench</title>
    <style>
      @font-face{font-family:"BricolageIcon";src:url("BricolageGrotesque.ttf") format("truetype");font-weight:200 800;font-stretch:75% 100%}
      @font-face{font-family:"ArchivoIcon";src:url("Archivo.ttf") format("truetype");font-weight:100 900}
    </style>
    <link rel="stylesheet" href="mockup-core.css" />
    <link rel="stylesheet" href="icon.css" />
  </head>
  <body>
    <script src="icon.js"></script>
    <script>
      /* ManHunt icon round 03.
         One master on the 1024 grid. Essential marks inside r469.
         The palette is the NIGHT SHIFT system; one lime point is the constant. */
      const R = {
        canvas: "#08090A",
        surface: "#121416",
        bone: "#F3EFE6",
        muted: "#A6A39B",
        flare: "#FF5A36",
        lime: "#B8F04A",
        cobalt: "#6D8CFF",
      };
      const RD = {
        canvas: "#08090A",
        surface: "#121416",
        bone: "#F3EFE6",
        muted: "#A6A39B",
        flare: "#FF5A36",
        lime: "#B8F04A",
        cobalt: "#6D8CFF",
      };
      const P = (extra) => ({
        light: { bg: R.canvas, mark: R.bone, accent: R.flare, point: R.lime, ...extra },
        dark: { bg: RD.canvas, mark: RD.bone, accent: RD.flare, point: RD.lime, ...extra },
        mono: { bg: "#000000", mark: "#ffffff", accent: "#ffffff", point: "#ffffff", ...extra },
      });

      const concepts = [
        {
          id: "openzone",
          name: "Open Zone",
          direction: "symbol",
          note: "The approved ManHunt Open Zone mark, adapted to NIGHT SHIFT: the ring is the field, the break is the hunt, the lime point is the report. This is the one that should be instantly ManHunt.",
          palettes: P(),
          art: (p) => `
            <path d="M709.6 440.0 A210.5 210.5 0 1 1 504.6 301.6" fill="none" stroke="${p.mark}" stroke-width="98.6" stroke-linecap="round"/>
            <circle cx="632.4" cy="319.0" r="81.5" fill="${p.point}"/>`,
        },
        {
          id: "openflare",
          name: "Open Flare",
          direction: "symbol",
          note: "The same approved geometry, field in flare instead of bone. More energy at 16 px, but the mark now competes with its own dot for attention.",
          palettes: P(),
          art: (p) => `
            <path d="M709.6 440.0 A210.5 210.5 0 1 1 504.6 301.6" fill="none" stroke="${p.accent}" stroke-width="98.6" stroke-linecap="round"/>
            <circle cx="632.4" cy="319.0" r="81.5" fill="${p.point}"/>`,
        },
        {
          id: "m",
          name: "M",
          direction: "letterform",
          note: "The brand initial, rounded and drawn by hand. It is recognisable as ManHunt only after the mark is known; at 16 px it is just an M.",
          palettes: P(),
          art: (p) => `
            <path d="M300 770 C300 520 300 360 344 340 C388 320 450 490 512 620 C574 490 636 320 680 340 C724 360 724 520 724 770" fill="none" stroke="${p.mark}" stroke-width="112" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="512" cy="468" r="40" fill="${p.point}"/>`,
        },
        {
          id: "hide",
          name: "Hide",
          direction: "symbol",
          note: "A single hooded silhouette. The most human option, but the least ManHunt-specific without the mark beside it.",
          palettes: P(),
          art: (p) => `
            <path d="M270 806 C230 700 270 570 384 530 C342 444 398 330 506 330 C618 330 672 444 628 530 C738 570 780 700 738 806 C620 846 388 846 270 806 Z" fill="${p.mark}"/>
            <circle cx="464" cy="464" r="42" fill="${p.point}"/>`,
        },
      ];

      renderIconWorkbench({
        title: "ManHunt",
        intro:
          "Icon round 05, built in the app-icon workbench. This round starts from the approved ManHunt Open Zone mark (design/brand/identity) instead of inventing another symbol. Open Zone and Open Flare test the mark; M and Hide are controls.",
        appName: "ManHunt",
        roles: R,
        concepts,
        typefaces: {
          glyph: "M",
          palette: { bg: R.canvas, fg: R.bone },
          fonts: [
            { family: "BricolageIcon", weight: 700 },
            { family: "ArchivoIcon", weight: 800 },
            { family: "Georgia", weight: 700 },
            { family: "Arial Black", weight: 900 },
          ],
        },
        shelf: {
          competitors: [
            { name: "Dark camera", bg: "#17181B", fg: "#F2F2F2", glyph: "circle" },
            { name: "Blue chat", bg: "#2F6FD6", fg: "#FFFFFF", glyph: "bubble" },
            { name: "Green map", bg: "#1E8E5A", fg: "#FFFFFF", glyph: "ring" },
            { name: "Yellow music", bg: "#F4C542", fg: "#1B1B1B", glyph: "wave" },
            { name: "White grid", bg: "#FFFFFF", fg: "#30343A", glyph: "grid" },
            { name: "Red play", bg: "#E33A35", fg: "#FFFFFF", glyph: "letter:P" },
          ],
        },
        pageNotes: [
          ["What changed for round 05", "Round 04 made new marks that were smooth but not ManHunt. Round 05 uses the approved mark geometry so recognition comes from the brand, not a new metaphor. Judged at 60 / 40 / 29 / 16 and Android 108/72/66."],
          ["Constant", "The approved Open Zone geometry plus one lime report point. Open Zone is the recommendation; Open Flare is the same mark with more heat."],
        ],
      });
    </script>
  </body>
</html>

<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home (light) — ManHunt · Street signal</title>
<link rel="stylesheet" href="/design/ui-v2/env/canvas.css">
<link rel="stylesheet" href="/design/ui-v2/directions/b-street-signal/direction.css">
<style>
  /* Daylight chalk: the brand's real light theme, not the env's cream scaffold. */
  :root {
    --field: #f7f9fc; --field-deep: #eef2f8; --lift: #ffffff; --lift-2: #e6ecf5;
    --chalk: #0f172a; --muted: #475569; --dim: #64748b;
    --rule: rgba(15,23,42,.14); --rule-mid: rgba(15,23,42,.22); --rule-strong: rgba(15,23,42,.32);
    --cyan: #0c6b84; --on-cyan: #ffffff;
    --coral: #b33a0f; --violet: #5b21b6; --error: #b91c1c;
    --paper: #ffffff; --paper-ink: #0b1220;
  }
  .home-brandline { font-family: var(--font-display); font-weight: 700; font-size: 34px; line-height: 31px; letter-spacing: -0.01em; }
  .verb { font-family: var(--font-display); font-weight: 700; font-size: 76px; line-height: 68px; letter-spacing: -0.02em; }
  .home-dock { position: absolute; left: 24px; right: 24px; bottom: 24px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
  .home-dock .btn { width: 100%; min-width: 0; }
  .settings-entry { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; font-family: var(--font-ui); font-weight: 700; font-size: 14px; color: var(--chalk); }
  .host-block { border-top: 2px solid var(--cyan); background: #0b1220; color: #e6edf7; }
  .host-block .field-label { color: #a7b6cc; }
  .host-block .input { border-color: rgba(230,237,247,.34); }
  .host-block .help { color: #9aa9bf; }
  .host-block .verb { color: #e6edf7; }
  .join-block { background: #ffffff; border-top: 1px solid #d3dce8; color: #0f172a; }
  .join-block .field-label { color: #475569; }
  .join-block .help { color: #44536a; }
  .join-block .code-cell { border-color: #7c8ca3; color: #0f172a; }
</style>
</head>
<body>
<main class="page" style="padding-bottom:108px;background:#f7f9fc;color:#0f172a">

  <header class="strip">
    <img src="/design/brand/identity/final/lockup/lockup-horizontal-dark-on-light.svg" alt="ManHunt" style="height:20px;width:auto">
    <span class="gutter-right"></span>
    <button class="settings-entry" type="button">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" class="stroke">
        <path d="M3 6h18M3 12h18M3 18h18"/><path d="M8 3v6M16 9v6M11 15v6" stroke-width="2"/>
      </svg>
      Settings
    </button>
  </header>

  <section class="gutter" style="margin-top:10px">
    <h1 class="home-brandline">Hide from your friends.</h1>
    <p class="small muted" style="margin-top:6px;color:#475569">Real-world GPS hide-and-seek.</p>
  </section>

  <div style="height:26px"></div>

  <!-- HOST block keeps its ink identity in daylight; the scoreboard never goes white. -->
  <section class="block host-block">
    <div class="verb">Host</div>
    <div class="mt12">
      <div class="field-label">Hunt name</div>
      <div class="input"><span style="font-family:var(--font-ui);font-size:16px;color:#e6edf7">Riverside Run</span></div>
      <div class="help" style="margin-top:6px">Leave it blank and the room is called ManHunt.</div>
    </div>
  </section>

  <!-- JOIN block is paper-white with ink text: the poster inversion. -->
  <section class="block join-block" style="border-top:1px solid #d3dce8;padding-top:18px">
    <div class="verb">Join</div>
    <div class="mt12">
      <div class="field-label">Got an invite code?</div>
      <div class="code-cells" style="margin-top:8px">
        <span class="code-cell"></span><span class="code-cell"></span><span class="code-cell"></span>
        <span class="code-cell"></span><span class="code-cell"></span><span class="code-cell"></span>
      </div>
      <div class="help" style="margin-top:8px">Enter the 6-character invite code the host sends you.</div>
    </div>
  </section>

  <div class="flex1"></div>

  <footer class="gutter" style="padding-bottom:4px">
    <div class="rule"></div>
    <div class="row spread" style="min-height:48px">
      <span class="data" style="color:#475569">Playing as Nadia</span>
      <div class="row gap16">
        <button class="inline" style="min-height:48px;color:#0f172a" type="button">Read the roles</button>
        <button class="inline" style="min-height:48px;color:#64748b" type="button">Sign out</button>
      </div>
    </div>
    <div class="credit-line tight" style="padding-bottom:2px;color:#44536a">v0.16.1 · free APK · Android 8+ · not on Play Store</div>
  </footer>

  <div class="home-dock">
    <button class="btn btn--primary" type="button"><span class="btn-label">Create hunt</span></button>
    <button class="btn btn--outline" type="button"><span class="btn-label">Join hunt</span></button>
  </div>

</main>
</body>
</html>

<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>غرفة الانتظار — ManHunt · Street signal</title>
<link rel="stylesheet" href="/design/ui-v2/env/canvas.css">
<link rel="stylesheet" href="/design/ui-v2/directions/b-street-signal/direction.css">
<style>
  .code-poster { font-family: var(--font-mono); font-size: 58px; line-height: 60px; letter-spacing: .05em;
                 font-variant-numeric: tabular-nums; color: var(--chalk); direction: ltr; unicode-bidi: isolate; }
  .lobby-dock { position: absolute; left: 24px; right: 24px; bottom: 24px; display: flex; flex-direction: column; gap: 10px; }
  .side-switch { display: inline-flex; align-items: center; gap: 4px; font-family: var(--font-arabic); font-size: 11px;
                 color: var(--muted); min-height: 32px; letter-spacing: 0; }
  .ar-title { font-family: var(--font-arabic); font-weight: 700; font-size: 21px; line-height: 30px; }
  .ar-body { font-family: var(--font-arabic); letter-spacing: 0; }
  [dir="rtl"] .tape { transform: rotate(1.5deg); }
  [dir="rtl"] .back-arrow svg { transform: scaleX(-1); }
</style>
</head>
<body>
<main class="page" style="padding-bottom:170px">

  <header class="strip" style="padding-top:16px;gap:10px">
    <button class="icon-btn icon-btn--bare back-arrow" type="button" aria-label="رجوع">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" class="stroke"><path d="M15 4 7 12l8 8"/></svg>
    </button>
    <div class="col" style="gap:3px">
      <h1 class="ar-title">مطاردة النهر</h1>
      <div class="row gap8">
        <span class="state ar-body" style="color:var(--muted);font-size:11px">الردهة</span>
        <span class="data-l">5 لاعبين</span>
      </div>
    </div>
    <span class="gutter-right row gap8">
      <button class="icon-btn icon-btn--bare" type="button" aria-label="سجل المطاردات">
        <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" class="stroke">
          <path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4h4"/><path d="M12 8v4l3 2"/>
        </svg>
      </button>
      <button class="icon-btn icon-btn--bare" type="button" aria-label="مغادرة الغرفة">
        <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" class="stroke">
          <path d="M10 4H4v16h6"/><path d="M15 8l4 4-4 4"/><path d="M19 12H9"/>
        </svg>
      </button>
    </span>
  </header>

  <section class="gutter" style="margin-top:6px">
    <div class="row spread" style="align-items:flex-end">
      <div class="col">
        <span class="tape" style="align-self:flex-start">رمز الدعوة</span>
        <div class="code-poster mt8">K7M2QX</div>
        <svg width="250" height="12" viewBox="0 0 250 12" aria-hidden="true" style="margin-top:2px">
          <path d="M2 8 C 52 3, 108 11, 160 6 S 224 9, 248 4" fill="none" stroke="var(--coral)" stroke-width="2.6" opacity=".85"/>
        </svg>
      </div>
      <div class="col" style="align-items:flex-end;gap:4px">
        <span class="data" style="color:var(--chalk)">5 / 5</span>
        <span class="ar-body" style="font-size:12px;color:var(--muted)">مستعد</span>
        <span class="tally" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><s class="on"></s></span>
      </div>
    </div>
    <div class="row spread" style="margin-top:10px;min-height:44px">
      <button class="inline ar-body" style="border:0;min-height:44px;font-size:14px" type="button">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" class="stroke">
          <path d="M12 15V3"/><path d="M8 7l4-4 4 4"/><path d="M4 14v5h16v-5"/>
        </svg>
        مشاركة الغرفة
      </button>
      <span class="cap ar-body">المس الرمز لنسخه.</span>
    </div>
  </section>

  <div class="rule" style="margin:10px 24px 0"></div>

  <section class="gutter" style="margin-top:16px">
    <div class="teamcol">
      <div class="team-head team-head--prey"><span class="ar-body">الفرائس</span><span>2</span></div>
      <div class="team-row">
        <span class="kit kit--prey ar-body">نادية</span>
        <span class="badge">المضيف</span><span class="badge ar-body">أنت</span>
        <button class="side-switch gutter-right" type="button" style="min-height:48px">
          مستعد
          <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" class="stroke check"><path d="M4 13l5 5L20 6"/></svg>
        </button>
      </div>
      <div class="team-row">
        <span class="kit kit--prey ar-body">رنا</span>
        <button class="side-switch gutter-right" type="button" style="min-height:48px">
          مستعد
          <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" class="stroke check"><path d="M4 13l5 5L20 6"/></svg>
        </button>
      </div>
    </div>

    <div class="teamcol" style="margin-top:16px">
      <div class="team-head team-head--hunters"><span class="ar-body">الصيادون</span><span>3</span></div>
      <div class="team-row">
        <span class="kit kit--hunters ar-body">عمر</span>
        <button class="side-switch gutter-right" type="button" style="min-height:48px">
          مستعد
          <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" class="stroke check"><path d="M4 13l5 5L20 6"/></svg>
        </button>
      </div>
      <div class="team-row">
        <span class="kit kit--hunters ar-body">سليم</span>
        <button class="side-switch gutter-right" type="button" style="min-height:48px">
          مستعد
          <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" class="stroke check"><path d="M4 13l5 5L20 6"/></svg>
        </button>
      </div>
      <div class="team-row">
        <span class="kit kit--hunters ar-body">يوسف</span>
        <button class="side-switch gutter-right" type="button" style="min-height:48px">
          مستعد
          <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" class="stroke check"><path d="M4 13l5 5L20 6"/></svg>
        </button>
      </div>
    </div>
    <div class="row" style="margin-top:10px">
      <span class="cap ar-body">اختر جانبك واستعد؛ يبدأ حكم المطاردة المطاردة.</span>
    </div>
  </section>

  <div class="lobby-dock">
    <div class="rule"></div>
    <div class="row spread" style="margin-top:2px">
      <span class="data ar-body" style="color:var(--muted);font-size:12px">كل اللاعبين مستعدون.</span>
      <button class="inline ar-body" style="border:0;min-height:32px;font-size:12px" type="button">قواعد المطاردة</button>
    </div>
    <button class="btn btn--primary ar-body" type="button"><span class="btn-label" style="font-family:var(--font-arabic)">ابدأ المطاردة</span></button>
    <div class="row spread">
      <span class="credit-line">مطاردة النهر · الغرفة <span class="ltr">K7M2QX</span></span>
      <span class="credit-line">5 لاعبين</span>
    </div>
  </div>

</main>
</body>
</html>

<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ManHunt — Sign in</title>
<link rel="stylesheet" href="/design/ui-v2/env/canvas.css">
<link rel="stylesheet" href="_a.css">
<style>
  .auth-plate { height: 264px; border-bottom: 1px solid var(--a-rule); }
  .auth-plate .lockup { position: absolute; inset-inline-start: 24px; top: 20px; color: #e6edf7; }
  .auth-plate .plate-line { position: absolute; inset-inline-start: 24px; bottom: 16px; font-family: var(--a-mono); font-size: 10.5px; line-height: 14px; letter-spacing: .05em; color: rgba(230,237,247,.62); }
  .auth-body { padding: 18px 24px 0; }
  .auth-line { font-size: 60px; line-height: 54px; letter-spacing: -.012em; }
  .auth-line + .bs { margin-top: 8px; }
  .form { margin-top: 20px; }
  .form .field-label { margin-top: 12px; }
  .form .field-label:first-child { margin-top: 0; }
  .pw { position: relative; }
  .pw .eye { position: absolute; inset-inline-end: 2px; top: 2px; width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: var(--a-muted); }
  .pw .field { padding-inline-end: 52px; }
  .signin { margin-top: 16px; }
  .mode-switch { margin-top: 4px; }
  .auth-foot { padding: 14px 24px 20px; margin-top: auto; }
  .auth-foot .rule-ticks { margin-bottom: 8px; }
  .server-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; }
  .server-row .da { color: var(--a-ink); }
  .server-row .muted-srv { color: var(--a-muted); }
  .server-row .inline { min-height: 44px; }
  .auth-ver { display: flex; align-items: center; justify-content: space-between; padding-top: 6px; font-family: var(--a-mono); font-size: 10.5px; line-height: 14px; letter-spacing: .05em; color: var(--a-muted); }
</style>
</head>
<body>
<main class="page">

  <!-- The app opens on the field: drawn borrowed pitch, official lockup over it. -->
  <div class="field-plate auth-plate" aria-hidden="true">
    <svg viewBox="0 0 390 264" preserveAspectRatio="xMidYMid slice">
      <rect width="390" height="264" fill="#0b1220"/>
      <g fill="#101827" stroke="#26324b" stroke-width="1">
        <rect x="10" y="20" width="70" height="34"/><rect x="90" y="20" width="86" height="34"/><rect x="186" y="20" width="60" height="34"/><rect x="256" y="20" width="76" height="34"/><rect x="342" y="20" width="44" height="34"/>
        <rect x="10" y="64" width="70" height="46"/><rect x="90" y="64" width="86" height="46"/><rect x="256" y="64" width="76" height="46"/><rect x="342" y="64" width="44" height="46"/>
        <rect x="10" y="120" width="70" height="40"/><rect x="90" y="120" width="86" height="40"/><rect x="186" y="120" width="60" height="40"/><rect x="256" y="120" width="76" height="40"/>
        <rect x="10" y="170" width="70" height="38"/><rect x="90" y="170" width="86" height="38"/><rect x="186" y="170" width="60" height="38"/><rect x="256" y="170" width="76" height="38"/><rect x="342" y="170" width="44" height="38"/>
        <rect x="10" y="218" width="70" height="30"/><rect x="90" y="218" width="86" height="30"/><rect x="256" y="218" width="76" height="30"/>
      </g>
      <g stroke="#223049" stroke-width="3"><path d="M180 0v264M0 58h390M0 113h390M0 165h390M0 212h390M334 0v264"/></g>
      <g fill="#0e2a33" opacity=".8"><rect x="186" y="113" width="58" height="52"/></g>
      <ellipse cx="214" cy="136" rx="132" ry="92" fill="none" stroke="#22d3ee" stroke-width="1.8" stroke-dasharray="9 8" opacity=".85"/>
      <path d="M118 196c34-14 44-38 68-46s38-30 56-36" stroke="#ff7a59" stroke-opacity=".5" stroke-width="2" fill="none" stroke-linecap="round"/>
      <circle cx="248" cy="116" r="7" fill="#ff7a59"/><circle cx="248" cy="116" r="16" fill="none" stroke="#ff7a59" stroke-opacity=".45" stroke-width="1.5"/>
      <circle cx="112" cy="200" r="5.5" fill="#ff7a59" fill-opacity=".4" stroke="#ff7a59" stroke-opacity=".7" stroke-width="1.4" stroke-dasharray="3 3"/>
      <circle cx="168" cy="206" r="6" fill="#e6edf7"/><circle cx="168" cy="206" r="13" fill="none" stroke="#e6edf7" stroke-opacity=".7" stroke-width="1.5"/>
      <g stroke="#a79bff" stroke-width="2" stroke-linecap="butt"><path d="M320 86l8 8-8 8M330 86l8 8-8 8"/><path d="M64 154l8 8-8 8M74 154l8 8-8 8"/></g>
      <g fill="#e6edf7" opacity=".05"><circle cx="40" cy="60" r="1.6"/><circle cx="210" cy="40" r="1.4"/><circle cx="300" cy="190" r="1.7"/><circle cx="150" cy="240" r="1.3"/><circle cx="360" cy="120" r="1.5"/></g>
    </svg>
    <div class="lockup">
      <svg width="26" height="26" viewBox="0 0 108 108" aria-label="ManHunt mark"><path d="M74.86,46.41A22.2,22.2 0 1 1 53.23,31.81" fill="none" stroke="#22D3EE" stroke-width="10.4" stroke-linecap="butt"/><circle cx="66.72" cy="33.65" r="8.6" fill="#FF7A59"/></svg>
      <svg viewBox="0 0 530 100" height="22" aria-label="MANHUNT" style="color:#e6edf7"><g fill="currentColor"><path transform="translate(0 0)" d="M0,0L16,0L16,100L0,100ZM60,0L76,0L76,100L60,100ZM7,0L20.5,0L44.75,100L31.25,100ZM55.5,0L69,0L44.75,100L31.25,100Z"/><path transform="translate(86 0)" d="M26.5,0L41.5,0L20,100L0,100ZM26.5,0L41.5,0L68,100L48,100ZM23,63L45,63L45,79L23,79Z"/><path transform="translate(164 0)" d="M0,0L16,0L16,100L0,100ZM52,0L68,0L68,100L52,100ZM7,0L24,0L65,100L48,100Z"/><path transform="translate(242 0)" d="M0,0L16,0L16,100L0,100ZM48,0L64,0L64,100L48,100ZM0,41L64,41L64,57L0,57Z"/><path transform="translate(316 0)" d="M0,0V66A34,34 0 0 0 68,66V0H0ZM16,0V66A18,18 0 0 0 52,66V0H16Z" fill-rule="evenodd"/><path transform="translate(394 0)" d="M0,0L16,0L16,100L0,100ZM52,0L68,0L68,100L52,100ZM7,0L24,0L65,100L48,100Z"/><path transform="translate(472 0)" d="M0,0L58,0L58,16L37,16L37,100L21,100L21,16L0,16Z"/></g></svg>
    </div>
    <div class="plate-line">The borrowed pitch · zone 240 m</div>
  </div>

  <div class="auth-body">
    <h1 class="d-l auth-line">Hide from<br>your friends.</h1>
    <p class="bs">Real-world GPS hide-and-seek.</p>

    <form class="form" onsubmit="return false">
      <div class="field-label"><span>Username</span><span class="da" style="font-size:10.5px">At least 3 characters</span></div>
      <div class="field is-value"><span>nadia</span><span class="caret"></span></div>

      <div class="field-label"><span>Password</span></div>
      <div class="pw">
        <div class="field is-value"><span>••••••••••</span></div>
        <span class="eye" aria-label="Show password">
          <svg class="icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="butt"><path d="M2 12s4-6 10-6 10 6 10 6-4 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="2.6"/></svg>
        </span>
      </div>

      <button class="btn primary signin" type="submit">Sign in</button>
      <div class="mode-switch">
        <span class="inline">New here? Create an account</span>
      </div>
    </form>
  </div>

  <footer class="auth-foot">
    <div class="rule-ticks"></div>
    <div class="server-row">
      <span class="da" style="white-space:nowrap;font-size:11.5px">Game server <span class="muted-srv">· hosted test server</span></span>
      <span class="inline" style="white-space:nowrap">Change server</span>
    </div>
    <div class="auth-ver" style="display:block;white-space:nowrap">v0.16.1 · free APK · Android 8+</div>
  </footer>

</main>
</body>
</html>

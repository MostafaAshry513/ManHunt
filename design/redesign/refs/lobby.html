<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>ManHunt - Lobby concept</title><link rel="stylesheet" href="app.css"></head>
<body>
<div class="phone">
  <div id="sb"></div>
  <header class="screen-head">
    <span class="hicon" id="back"></span>
    <span class="end" style="margin-left:auto"><span class="hicon" id="share"></span><span class="hicon" id="history"></span></span>
  </header>

  <div class="board" style="border-top:0">
    <div class="board-top">
      <div>
        <div class="stateword">LOBBY</div>
        <div class="board-name">Riverside Run</div>
      </div>
      <div class="board-right">
        <div class="board-meta">5 / 5 <b>READY</b></div>
        <div class="readybar"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i></div>
      </div>
    </div>
    <div class="board-vals" style="align-items:baseline">
      <span class="board-meta" style="letter-spacing:.12em">INVITE CODE</span>
      <span class="data-l" style="color:var(--chalk);font-size:18px;letter-spacing:.14em">K7M2QX</span>
      <span class="tag chalk" style="margin-left:auto" id="shareTag"></span>
    </div>
  </div>

  <div class="tabrule"><div class="on">Hunt</div><div>Chat</div></div>

  <div class="screen scrollable" style="gap:14px">
    <div class="rule-with-label mt-2">THE TEAMS</div>
    <div class="sheets">
      <section class="sheet prey">
        <div class="sheet-h"><span id="preyIco"></span><span class="name">Prey</span><span class="count">2</span></div>
        <div class="player me">
          <span class="avatar">Y</span>
          <div style="min-width:0"><div class="pname">Yasmin</div><div class="pstat">READY</div></div>
          <span class="end"><span class="host-mark">HOST</span></span>
        </div>
        <div class="player">
          <span class="avatar">L</span>
          <div style="min-width:0"><div class="pname">Leila</div><div class="pstat">READY</div></div>
          <span class="end" id="check1"></span>
        </div>
      </section>
      <section class="sheet hunters">
        <div class="sheet-h"><span id="hunIco"></span><span class="name">Hunters</span><span class="count">3</span></div>
        <div class="player">
          <span class="avatar">O</span>
          <div style="min-width:0"><div class="pname">Omar</div><div class="pstat">READY</div></div>
          <span class="end" id="check2"></span>
        </div>
        <div class="player">
          <span class="avatar">T</span>
          <div style="min-width:0"><div class="pname">Tariq</div><div class="pstat">READY</div></div>
          <span class="end" id="check3"></span>
        </div>
        <div class="player" style="border-bottom:0">
          <span class="avatar">S</span>
          <div style="min-width:0"><div class="pname">Sara</div><div class="pstat">READY</div></div>
          <span class="end" id="check4"></span>
        </div>
      </section>
    </div>

    <div class="rule mt-2"></div>
    <div class="row between">
      <span class="data">60 MIN &middot; REPORT EVERY 5 MIN &middot; ZONE 240 M</span>
      <span class="inline-action" style="font-size:12px">Hunt rules</span>
    </div>
  </div>

  <div class="dock">
    <div class="status"><span class="txt">Everyone's ready. The hunt is yours to start.</span><span class="reason">HOST</span></div>
    <button class="btn">Begin the hunt</button>
  </div>
  <div id="nav"></div>
</div>
<script src="parts.js"></script>
<script>
  document.getElementById('sb').innerHTML = statusbar();
  document.getElementById('back').innerHTML = ico('back');
  document.getElementById('share').innerHTML = ico('share');
  document.getElementById('history').innerHTML = ico('history');
  document.getElementById('shareTag').innerHTML = ico('share') + ' SHARE CODE';
  document.getElementById('preyIco').innerHTML = ico('prey');
  document.getElementById('hunIco').innerHTML = ico('hunters');
  for (const id of ['check1','check2','check3','check4']) document.getElementById(id).innerHTML = ico('check');
  document.getElementById('nav').innerHTML = navBar();
</script>
</body>
</html>

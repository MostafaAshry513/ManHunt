<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ManHunt — MATCHDAY hero 1280×560 (README poster)</title>
<link rel="stylesheet" href="base.css">
<style>
  .hero { position: relative; width: 1280px; height: 560px; background: var(--field); overflow: hidden; }
  .poster { position: absolute; left: 0; top: 0; width: 724px; height: 560px; }
  .lockup { position: absolute; left: 64px; top: 46px; width: 228px; }
  .poster-type { position: absolute; left: 60px; top: 118px; font-size: 136px; }
  .deck { position: absolute; left: 64px; top: 474px; width: 640px; }
  .micro { position: absolute; left: 64px; top: 528px; }
  .map-panel { left: 724px; top: 0; width: 556px; height: 560px; }
  .board { width: 330px; }
  .board .board-clock { font-size: 46px; }
</style>
</head>
<body>
<div class="hero" id="hero">
  <div class="poster">
    <div class="lockup"><img src="/docs/brand/lockup-light-on-dark.png" alt="ManHunt"></div>
    <h1 class="poster-type"><span>Hide</span><span>from your</span><span>friends.</span></h1>
    <p class="deck">Real-world hide-and-seek for Android.<br>Two teams, one street, one clock the players can’t bend.</p>
    <p class="micro">Free APK · Android 8.0+ · not on Play Store</p>
  </div>
  <div class="map-panel">
    <div class="map-img"></div>
    <div class="veil"></div>
    <div class="board">
      <div class="board-state"><i class="dot live-dot"></i>Hunting</div>
      <div class="board-clock">41:12</div>
      <div class="board-data"><span>Prey 2 / 2</span><span>Zone 240 m</span></div>
    </div>
    <svg class="marks" viewBox="0 0 556 560" fill="none" aria-hidden="true">
      <g class="ov">
        <g class="zone-breathe" style="--zone-origin: 300px 340px">
          <circle cx="300" cy="340" r="188" stroke="#22D3EE" stroke-opacity="0.22" stroke-width="1.4" stroke-dasharray="2 10"/>
          <path d="M418.1,217.7A170,170 0 1 1 358.1,180.3" stroke="#22D3EE" stroke-opacity="0.9" stroke-width="3.4" stroke-linecap="butt"/>
          <circle cx="300" cy="340" r="2.4" fill="#22D3EE" fill-opacity="0.9"/>
        </g>
        <path class="trail-anim" d="M150,440 L214,400 L262,368 L318,330" stroke="#FF7A59" stroke-opacity="0.8" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="6 8"/>
        <circle class="ping" cx="322" cy="330" r="24" stroke="#FF7A59" stroke-width="2"/>
        <circle class="ping ping--1" cx="322" cy="330" r="24" stroke="#FF7A59" stroke-width="2"/>
        <circle class="ping ping--2" cx="322" cy="330" r="24" stroke="#FF7A59" stroke-width="2"/>
        <circle cx="322" cy="330" r="21" stroke="#FF7A59" stroke-opacity="0.55" stroke-width="1.8"/>
        <circle cx="322" cy="330" r="12" fill="#FF7A59"/>
        <g>
          <circle cx="178" cy="262" r="15" stroke="#A79BFF" stroke-opacity="0.42" stroke-width="1.6"/>
          <circle cx="178" cy="262" r="8.5" fill="#A79BFF"/>
          <circle cx="438" cy="384" r="15" stroke="#A79BFF" stroke-opacity="0.42" stroke-width="1.6"/>
          <circle cx="438" cy="384" r="8.5" fill="#A79BFF"/>
        </g>
      </g>
      <g id="live-ping" style="display:none">
        <circle class="ping" cx="0" cy="0" r="26" stroke="#FF7A59" stroke-width="2.2"/>
        <circle class="ping ping--1" cx="0" cy="0" r="26" stroke="#FF7A59" stroke-width="2.2"/>
        <circle class="ping ping--2" cx="0" cy="0" r="26" stroke="#FF7A59" stroke-width="2.2"/>
        <circle cx="0" cy="0" r="34" stroke="#FF7A59" stroke-opacity="0.28" stroke-width="1.4"/>
      </g>
    </svg>
    <div class="credit">© OpenStreetMap contributors</div>
  </div>
</div>
<script>
  (function () {
    const p = new URLSearchParams(location.search);
    const map = p.get('map') || '/server/public/site/map-hero.jpg';
    const pos = p.get('mapPos') || 'center 42%';
    const size = p.get('mapSize') || 'cover';
    const useMarks = p.get('marks') !== '0';
    document.documentElement.style.setProperty('--map-src', "url('" + map + "')");
    document.documentElement.style.setProperty('--map-pos', pos);
    document.documentElement.style.setProperty('--map-size', size);
    const ov = document.querySelector('.ov');
    const livePing = document.getElementById('live-ping');
    if (!useMarks) {
      if (ov) ov.style.display = 'none';
      if (livePing) livePing.style.display = 'inline';
      const ping = (p.get('pings') || '0,0').split(',').map(Number);
      if (livePing) livePing.setAttribute('transform', 'translate(' + ping[0] + ' ' + ping[1] + ')');
    }
    const animations = () => document.getAnimations();
    window.renderAt = (t) => {
      for (const a of animations()) { try { a.pause(); a.currentTime = t * 1000; } catch (e) { /* noop */ } }
      return t;
    };
    requestAnimationFrame(() => { window.renderAt(0); window.MH_READY = true; });
  })();
</script>
</body>
</html>
